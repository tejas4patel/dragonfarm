url: https://dragonfarm.dev/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#2F6F8F"
    base_font: "Inter"
    heading_font: "Space Grotesk"
    code_font: "JetBrains Mono"
  opengraph:
    image:
      src: https://dragonfarm.dev/social.png
      alt: "dragonfarm: fine-tune a language model from R in minutes"
  includes:
    in_header: |
      <meta name="twitter:card" content="summary_large_image">
      <link rel="icon" type="image/svg+xml" href="/favicon.svg">

navbar:
  bg: dark
  type: dark
  structure:
    left: [get-started, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    get-started:
      text: Get started
      href: articles/quickstart.html

